plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = '1.0.2'
group = 'com.mercenarywardrobe'

base {
    archivesName = 'Merc-Wardrobe'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
}

mixin {
    add sourceSets.main, 'mercenary_wardrobe.refmap.json'
    config 'mercenary_wardrobe.mixins.json'
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveFileName = 'Merc-Wardrobe-1.0.2.jar'
    manifest {
        attributes([
            'Specification-Title'     : 'mercenary_wardrobe',
            'Specification-Vendor'    : '_jang',
            'Specification-Version'   : '1',
            'Implementation-Title'    : 'Mercenary Wardrobe',
            'Implementation-Version'  : '1.0.2',
            'Implementation-Vendor'   : '_jang',
            'MixinConfigs'            : 'mercenary_wardrobe.mixins.json'
        ])
    }
}
